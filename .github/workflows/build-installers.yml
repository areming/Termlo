name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/platform-smoke.cjs
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: termlo-windows-x64
          path: release/*/Termlo-Setup-*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/platform-smoke.cjs
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: termlo-macos-${{ matrix.arch }}
          path: release/*/Termlo-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: termlo-*
          merge-multiple: true
          path: release-upload
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-upload/* --verify-tag --title "Termlo ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
